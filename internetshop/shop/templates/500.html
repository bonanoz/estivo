<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка сервера | ESTIVO</title>
    <meta name="robots" content="noindex">
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 16px;
            background: #fdfdfd;
            color: #281913;
            font-family: Georgia, 'Times New Roman', serif;
        }
        main { width: 100%; max-width: 560px; }
        h1 { margin: 0 0 16px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: clamp(44px, 6vw, 76px); line-height: 1.02; }
        p { margin: 0 0 24px; color: #3c3c3c; font-size: 1.05rem; line-height: 1.6; }
        a {
            display: inline-flex;
            align-items: center;
            min-height: 52px;
            padding: 16px 36px;
            border-radius: 5px;
            background: #333333;
            color: #ffffff;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-weight: 600;
            text-decoration: none;
        }
        a:hover { opacity: 0.85; }
        a:focus-visible { outline: 2px solid #b83400; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <h1>Что-то пошло не так</h1>
        <p>На сервере произошла ошибка. Мы уже разбираемся — попробуйте обновить страницу чуть позже.</p>
        <a href="/">На главную</a>
    </main>
</body>
</html>
