<button type="button" class="icon-btn product-card__heart"
        hx-post="{% url 'wishlist_toggle' product.id %}" hx-swap="outerHTML"
        aria-pressed="{% if in_wishlist %}true{% else %}false{% endif %}"
        aria-label="Избранное: {{ product.name }}">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>
</button>
<span hx-swap-oob="innerHTML:[data-wishlist-count]" data-wishlist-count>{{ wishlist.count }}</span>
