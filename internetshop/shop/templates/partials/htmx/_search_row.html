{% load static humanize shop_tags %}{% comment %}Строка подсказки поиска: фото, название, цена. Ожидает `product`.{% endcomment %}
<li>
    <a href="{{ product.get_absolute_url }}" class="search-row">
        <span class="search-row__media">
            {% if product.main_image %}<img src="{{ product.main_image|thumb_url }}" alt="" width="64" height="48" loading="lazy">
            {% else %}<img src="{% static 'img/placeholders/product.svg' %}" alt="" width="64" height="48" loading="lazy">{% endif %}
        </span>
        <span class="search-row__name">{{ product.name }}</span>
        {% if product.price %}<span class="search-row__price">{{ product.price|intcomma }}&nbsp;₽</span>{% endif %}
    </a>
</li>
